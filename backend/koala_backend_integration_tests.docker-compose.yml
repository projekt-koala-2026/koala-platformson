services:
  postgres:
    build:
      context: .
      dockerfile: koala_postgres.Dockerfile
    env_file:
      - test.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    build:
      context: .
      dockerfile: koala_redis.Dockerfile
    env_file:
      - test.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  mailpit:
    build:
      context: .
      dockerfile: koala_test_mailpit.Dockerfile
    env_file:
      - test.env
  integration-tests:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0
        WORKDIR /app
        COPY . .
    command: ["dotnet", "test", "./koala/koala-integration-tests.csproj"]
    env_file:
      - test.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started