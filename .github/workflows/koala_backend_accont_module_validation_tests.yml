name: Backend_Account_Validation_Tests

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet clean
          dotnet restore --no-cache
          dotnet list koala-validation-tests.csproj package
        working-directory: ./backend/koala/src/Modules/Account/Tests/ValidationTests

      - name: Build solution
        run: dotnet build --no-restore --configuration Release
        working-directory: ./backend/koala/src/Modules/Account/Tests/ValidationTests

      - name: Run xUnit tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./backend/koala/src/Modules/Account/Tests/ValidationTests