name: Backend_Unit_Tests

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          rm -rf obj bin
          dotnet restore koala-unit-tests.csproj --no-cache
          dotnet list koala-unit-tests.csproj package
        working-directory: ./backend/koala

      - name: Build solution
        run: dotnet build koala-unit-tests.csproj --no-restore --configuration Release
        working-directory: ./backend/koala

      - name: Run xUnit tests
        run: dotnet test koala-unit-tests.csproj --no-build --configuration Release --verbosity normal
        working-directory: ./backend/koala