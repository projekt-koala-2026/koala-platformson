name: Backend_Unit_Tests

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore koala.csproj --no-cache
          dotnet restore koala-unit-tests.csproj --no-cache
        working-directory: ./backend/koala

      - name: Debug test project
        run: |
          pwd
          ls -la
          echo "---- TEST PROJECT ----"
          cat koala-unit-tests.csproj
          echo "---- PACKAGES ----"
          dotnet list koala-unit-tests.csproj package
          echo "---- NUGET CACHE ----"
          ls -la ~/.nuget/packages/moq || true
          ls -la ~/.nuget/packages/xunit || true
        working-directory: ./backend/koala

      - name: Build solution
        run: dotnet build koala-unit-tests.csproj --no-restore --configuration Release
        working-directory: ./backend/koala

      - name: Run xUnit tests
        run: dotnet test koala-unit-tests.csproj --no-build --configuration Release --verbosity normal
        working-directory: ./backend/koala