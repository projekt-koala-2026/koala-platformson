name: Build - Redis

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/koala_redis.Dockerfile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/koala_redis.Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/koala_redis.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/koala_redis:latest
            ghcr.io/${{ github.repository_owner }}/koala_redis:${{ github.run_number }}